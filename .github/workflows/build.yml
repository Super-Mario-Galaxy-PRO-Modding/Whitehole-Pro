name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows (MSYS2 UCRT64, GCC)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake

      - name: Configure
        run: cmake -S . -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DWHITEHOLE_STATIC_RUNTIME=ON

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test the CLI
        run: build/whitehole-pro-console.exe map objects data/templates/SMG2BigGalaxyMap.arc

      - name: Smoke test the object database download
        # Non-fatal on purpose: it exercises the same WinHTTP path the editor's
        # first-run bootstrap uses, but a CI runner without network access must
        # not go red for that.
        continue-on-error: true
        run: build/whitehole-pro-console.exe objectdb update

      - name: Reject stray scratch files
        # _*.txt / _*.ps1 diagnostics, *.tmp and *.bak copies of real sources
        # were once committed by accident and had to be un-tracked; this keeps
        # them out for good.
        run: |
          strays=$(git status --porcelain | grep -E '^\?\? (_|.*\.tmp$|.*\.bak$)' || true)
          if [ -n "$strays" ]; then
            echo "untracked scratch files must not be committed:"
            echo "$strays"
            exit 1
          fi

      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: WhiteholePro-win64
          if-no-files-found: error
          path: |
            build/whitehole-pro.exe
            build/whitehole-pro-console.exe